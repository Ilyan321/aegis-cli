name: Release Aegis

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Verification Tests
        run: go test -v -race ./...

      - name: Build Cross-Platform Binaries & Archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          PLATFORMS=(
            "linux/amd64/aegis"
            "linux/arm64/aegis"
            "darwin/amd64/aegis"
            "darwin/arm64/aegis"
            "windows/amd64/aegis.exe"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            IFS="/" read -r OS ARCH BINARY <<< "$PLATFORM"
            OUTPUT_NAME="aegis_${OS}_${ARCH}"
            BUILD_DIR="dist/${OUTPUT_NAME}"
            mkdir -p "$BUILD_DIR"

            echo "Building for ${OS}/${ARCH}..."
            CGO_ENABLED=0 GOOS="$OS" GOARCH="$ARCH" go build \
              -ldflags="-s -w -X main.Version=${VERSION}" \
              -trimpath \
              -o "${BUILD_DIR}/${BINARY}" \
              cmd/aegis/main.go

            cp README.md LICENSE "$BUILD_DIR/"

            if [ "$OS" == "windows" ]; then
              (cd dist && zip -r "${OUTPUT_NAME}.zip" "${OUTPUT_NAME}")
            else
              tar -czf "dist/${OUTPUT_NAME}.tar.gz" -C dist "${OUTPUT_NAME}"
            fi
          done

          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Aegis CLI ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
